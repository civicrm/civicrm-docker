# Apache configuration specific to CiviCRM on WordPress in /var/www/html.

# wp-content/uploads/ is writable by the web server and holds civicrm.settings.php, so it may
# serve static files but never run PHP. CiviCRM's own .htaccess files there stay in effect.
<Directory "/var/www/html/wp-content/uploads">
    # Also covers files a .htaccess there maps to the PHP handler; .htaccess cannot lift php_admin_*.
    php_admin_flag engine off
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
