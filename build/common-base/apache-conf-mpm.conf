# Apache MPM sizing. conf-enabled is loaded after mods-enabled, so this
# overrides the distro mpm_prefork.conf.
#
# Each prefork worker holds its own PHP interpreter, so MaxRequestWorkers x PHP
# memory_limit is the container's worst-case memory. ServerLimit follows it so
# values above Apache's default ceiling of 256 need no second setting.

<IfModule mpm_prefork_module>
    ServerLimit         ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers   ${APACHE_MAX_REQUEST_WORKERS}
</IfModule>
