# Apache MPM sizing.
#
# Loaded from conf-enabled, which apache2.conf includes after mods-enabled, so
# this takes precedence over the distro mpm_prefork.conf default of 150.
#
# Each prefork worker holds its own PHP interpreter, so MaxRequestWorkers
# multiplied by the PHP memory_limit is the worst-case memory this container can
# demand. Size it against the container's memory limit.
#
# ServerLimit is the ceiling for MaxRequestWorkers and is pinned to the same
# value, so one variable sizes the container and raising it above Apache's
# default ceiling of 256 works without a second setting. Apache allocates shared
# memory for ServerLimit slots whether or not they are used, so keeping the two
# equal also avoids reserving for workers that can never start.

<IfModule mpm_prefork_module>
    ServerLimit         ${APACHE_MAX_REQUEST_WORKERS}
    MaxRequestWorkers   ${APACHE_MAX_REQUEST_WORKERS}
</IfModule>
