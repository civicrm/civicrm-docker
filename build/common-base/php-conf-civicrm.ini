expose_php = Off
; CERT-EU 2026-018 / CVE-2026-109619 — blocks confirmed session upload-progress paths.
; Apache also sets php_admin_flag session.upload_progress.enabled off so apps cannot re-enable it.
session.upload_progress.enabled = Off
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 300
max_input_time = -1
max_input_vars = 10000
date.timezone = ${PHP_DATE_TIMEZONE:-"UTC"}
log_errors = On
error_log = /dev/stderr
