# This file contains CiviCRM specific apache configuration.
# See also /etc/apache2/sites-available/000-default.conf for configuration that
# applies to the virtual host.

# This silences the complaint from Apache that the ServerName has not been set.
ServerName localhost

# civicrm-docker-applypatches keeps its record of applied patches in the patched
# directory, so it is replaced along with the code; never serve it.
<Files ".civicrm-docker-patches">
    Require all denied
</Files>
