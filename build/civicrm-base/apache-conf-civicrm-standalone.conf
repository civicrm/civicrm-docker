# Apache configuration specific to CiviCRM Standalone in /var/www/html.

# private/ holds civicrm.settings.php, logs, uploads and caches: never served.
<Directory "/var/www/html/private">
    Require all denied
</Directory>

# public/ is writable by the web server, so it may serve static files but never run PHP.
# AllowOverride None keeps a .htaccess written there from lifting that.
<Directory "/var/www/html/public">
    AllowOverride None
    <FilesMatch "\.(php|phtml|phar)$">
        Require all denied
    </FilesMatch>
</Directory>
